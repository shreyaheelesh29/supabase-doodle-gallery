<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Doodle Museum</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Fabric.js v6 -->
    <script src="https://cdn.jsdelivr.net/npm/fabric@6.6.1/dist/index.min.js"></script>
</head>

<body>

<div class="container">

    <header>
        <h1>🎨 Virtual Doodle Museum</h1>
        <p>Draw something amazing and share it with everyone.</p>
    </header>

    <!-- Drawing Area -->
    <section class="drawing-panel">

        <div class="input-group">
            <input type="text" id="title" placeholder="Title of your doodle *">
            <input type="text" id="artist" placeholder="Artist Name (Optional)">
        </div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="800" height="500"></canvas>
        </div>

        <!-- Main Toolbar -->
        <div class="toolbar">

            <!-- Tools Section -->
            <div class="tool-section">
                <button id="pencilBtn" class="active-tool">✏️ Pencil</button>
                <button id="lineBtn">📏 Line</button>
                <button id="rectBtn">⬜ Rect</button>
                <button id="circleBtn">⭕ Circle</button>
                <button id="eraserBtn">🧽 Eraser</button>
            </div>

            <!-- Custom Color & Brush Size -->
            <div class="tool-section">
                <div>
                    <label>🎨 Color</label>
                    <input type="color" id="colorPicker" value="#000000">
                </div>

                <div>
                    <label>🖌️ Size</label>
                    <input type="range" id="brushSize" min="1" max="40" value="5">
                </div>
            </div>

            <!-- Color Palette Swatches -->
            <div class="color-palette">
                <span class="swatch" data-color="#000000" style="background:#000000;"></span>
                <span class="swatch" data-color="#e74c3c" style="background:#e74c3c;"></span>
                <span class="swatch" data-color="#3498db" style="background:#3498db;"></span>
                <span class="swatch" data-color="#2ecc71" style="background:#2ecc71;"></span>
                <span class="swatch" data-color="#f1c40f" style="background:#f1c40f;"></span>
                <span class="swatch" data-color="#9b59b6" style="background:#9b59b6;"></span>
            </div>

            <!-- Actions -->
            <div class="tool-section">
                <button id="undoBtn">↩️ Undo</button>
                <button id="redoBtn">↪️ Redo</button>
                <button id="clearBtn">🗑️ Clear</button>
                <button id="downloadBtn">📥 Download</button>
                <button id="uploadBtn">💾 Save Drawing</button>
            </div>

        </div>

    </section>

    <!-- Gallery Section -->
    <section>
        <div class="gallery-header">
            <h2>🖼️ Museum Gallery</h2>

            <div class="gallery-controls">
                <input type="text" id="searchInput" placeholder="Search by title or artist...">
                <select id="sortSelect">
                    <option value="recent">Most Recent</option>
                    <option value="likes">Most Liked ❤️</option>
                </select>
            </div>
        </div>

        <div id="gallery" class="gallery"></div>
    </section>

</div>

<!-- JS Scripts -->
<script src="supabase.js"></script>
<script src="canvas.js"></script>
<script src="script.js"></script>

</body>
</html>
